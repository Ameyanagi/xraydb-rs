[package]
name = "xraydb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "X-ray reference data for the elements: absorption edges, emission lines, and Elam/Chantler cross-sections"
readme = "README.md"
documentation = "https://docs.rs/xraydb"
keywords = ["xray", "physics", "spectroscopy", "crystallography", "science"]
categories = ["science", "data-structures"]
exclude = ["/benches/**"]

[features]
optics = ["dep:num-complex"]

[dependencies]
xraydb-data = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
ruzstd = { workspace = true }
thiserror = { workspace = true }
num-complex = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
num-complex = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "lookup_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
