[workspace]
members = ["xraydb-cli", "xraydb-data", "xraydb-generate", "xraydb-lib", "xraydb-wasm"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
# Multi-line let-chains (`if let .. && ..`) require 1.88 on edition 2024.
rust-version = "1.88"
authors = ["Ameyanagi <contact@ameyanagi.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ameyanagi/xraydb-rs"

[workspace.dependencies]
xraydb = { version = "0.2.0", path = "xraydb-lib" }
xraydb-data = { version = "0.2.0", path = "xraydb-data" }

anyhow = "1"
approx = "0.5"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
js-sys = "0.3"
console_error_panic_hook = "0.1"
num-complex = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
ruzstd = "0.8"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
